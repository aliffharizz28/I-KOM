name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Execute Deployment Commands on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            set -e

            # 1. Move to the project folder
            cd /var/www/ikom/ikom
            
            # 2. Pull the latest code from GitHub forcefully
            # (This prevents 'unmerged files' errors by making the server match GitHub exactly)
            git fetch origin main
            git reset --hard origin/main
            
            # 3. Install any new PHP packages
            composer install --no-dev --optimize-autoloader
            
            # 4. Run any new database migrations
            php artisan migrate --force
            
            # 5. Clear and rebuild the cache to show the newest changes
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
